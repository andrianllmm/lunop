name: forecast

on:
  schedule:
    - cron: "0 22 * * *" # 06:00 PHT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Predict
        run: cd pipeline && uv run python -m lunop.modeling.predict
      - name: Commit if changed
        run: |
          git diff --quiet web/public/data/forecast.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): daily forecast" web/public/data/forecast.json
          git push
