[project]
name = "lunop-eda"
version = "0.1.0"
description = "Exploratory data analysis for Project LUNOP"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "matplotlib",
    "statsmodels",
    "scipy",
]

[dependency-groups]
dev = ["jupytext", "nbconvert", "ipykernel"]

[tool.uv]
package = false

[tool.jupytext]
formats = "ipynb,py:percent"
