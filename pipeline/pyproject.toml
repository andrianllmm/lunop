[project]
name = "lunop"
version = "0.1.0"
description = "Data pipeline and forecast model for Project LUNOP"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scipy",
    "statsmodels",
    "geopandas",
    "shapely",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lunop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
